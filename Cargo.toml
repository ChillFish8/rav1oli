[workspace]
resolver = "3"
members = [
    "rav1oli",
    "rav1oli-svt",
    "rav1oli-vship"
]

[workspace.package]
version = "0.1.0"
readme = "README.md"
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
bindgen = "0.73"
cc = "1.2"
pkg-config = "0.3"
tempfile = "3"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = "0.3"

clap = { version = "4", features = ["derive", "env"] }

