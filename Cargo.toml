[workspace]
resolver = "3"
members = [
    "rav1oli",
    "rav1oli-bestsource",
    "rav1oli-quantise",
    "rav1oli-svt",
    "rav1oli-table",
    "rav1oli-vship"
]

[workspace.package]
version = "0.1.0"
readme = "README.md"
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
arrow-array = "60.1"
arrow-schema = "60.1"
bindgen = "0.73"
cc = "1.2"
cmake = "0.1.58"
divan = "0.1.21"
pkg-config = "0.3"
serde_json = "1"
strsim = "0.11"
tempfile = "3"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = "0.3"

blake3 = { version = "1.8", features = ["mmap", "rayon"] }
clap = { version = "4", features = ["derive", "env"] }
parquet = { version = "60.1", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1", features = ["derive"] }

rav1oli-bestsource = { path = "rav1oli-bestsource" }
rav1oli-quantise = { path = "rav1oli-quantise" }
rav1oli-svt = { path = "rav1oli-svt" }
rav1oli-table = { path = "rav1oli-table" }
rav1oli-vship = { path = "rav1oli-vship" }
